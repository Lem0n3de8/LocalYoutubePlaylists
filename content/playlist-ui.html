<div id="playlist-overlay" class="playlist-overlay">
    <div class="playlist-ui">
        <h2>Save to playlist</h2>
        <div id="playlist-container"></div>
        <button id="create-playlist">Create playlist</button>
        <div id="create-playlist-form" hidden>
            <input type="text" name="playlist-name" id="playlist-name" placeholder="Playlist name">
            <button id="confirm-create-playlist">Create</button>
            <button id="cancel-create-playlist">Cancel</button>
        </div>
    </div>
</div>
